id: ec2-detection

info:
  name: AWS EC2 Detection
  severity: info
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ec2,aws

dns:
  - name: "{{BaseURL}}"
    type: CNAME

    matchers:
      - type: regex
        regex:
          - "ec2-[-\\d]+\\.compute[-\\d]*\\.amazonaws\\.com"
          - "ec2-[-\\d]+\\.[\\w\\d\\-]+\\.compute[-\\d]*\\.amazonaws\\.com"
