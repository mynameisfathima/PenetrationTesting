id: spoofable-spf-records-ptr

info:
  name: Spoofable SPF Records with PTR Mechanism
  author: binaryfigments
  severity: info
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,spf

dns:
  - name: "{{BaseURL}}"
    type: TXT
    matchers:
      - type: word
        words:
          - "v=spf1"

