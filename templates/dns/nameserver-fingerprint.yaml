id: nameserver-fingerprint

info:
  name: NS Record Detection
  author: pdteam
  severity: info
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: dns,ns

dns:
  - name: "{{BaseURL}}"
    type: NS
    matchers:
      - type: regex
        part: answer
        regex:
          - "IN\tNS\\t(.+)$"
